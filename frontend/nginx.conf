server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the backend at request time (Docker's DNS), so the dashboard starts even
    # while the API container is still booting
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # API and OpenAI-compatible gateway are served by the backend container
    location /api/ { proxy_pass $api; proxy_set_header Host $host; }
    location /v1/  { proxy_pass $api; proxy_set_header Host $host; }

    # Single-page app: unknown paths fall back to index.html
    location / { try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
