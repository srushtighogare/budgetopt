services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: budgetopt
      POSTGRES_PASSWORD: budgetopt
      POSTGRES_DB: budgetopt
    ports: ["127.0.0.1:5433:5432"]  # local only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetopt"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]  # local only

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://budgetopt:budgetopt@postgres:5432/budgetopt
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [models:/app/.cache]  # embedding model, downloaded once
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  dashboard:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  models:
