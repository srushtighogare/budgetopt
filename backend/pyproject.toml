[project]
name = "budgetopt-backend"
version = "0.1.0"
description = "BudgetOpt: AI based cost-optimal LLM selection and token budget optimization platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "redis>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "pymoo>=0.6.1",
    "ortools>=9.11",
    "statsmodels>=0.14",
    "pandas>=2.2",
    "fastembed>=0.7",
    "pgvector>=0.3",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "fastembed>=0.7",
    "pgvector>=0.3",
    "pyarrow>=16",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # OR-Tools' SWIG bindings, harmless
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults
